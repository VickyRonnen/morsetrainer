<VirtualHost *:80>
        ServerName pa5wpm.pc.test
        ServerAdmin webmaster@pa5wpm.pc.test

        # Path-preserving HTTP to HTTPS redirect
        Redirect permanent / https://pa5wpm.pc.test/
</VirtualHost>

<VirtualHost *:443>
        ServerName pa5wpm.pc.test
        ServerAdmin webmaster@pa5wpm.pc.test

        # SSL Configuration
        SSLEngine on
	    SSLCertificateFile    /etc/pki/tls/certs/pc.test.crt
	    SSLCertificateKeyFile /etc/pki/tls/private/pc.test.key

        # Modern protocol support (HTTP/2)
        Protocols h2 http/1.1

        DocumentRoot "/var/www/pa5wpm"
        <Directory "/var/www/pa5wpm">
                Options -Indexes +FollowSymLinks
                AllowOverride None
                Require all granted

                # Angular routing fallback
                RewriteEngine On
                RewriteBase /
                RewriteRule ^index\.html$ - [L]
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule ^ index.html [L]
        </Directory>

        # Security Headers (Requires mod_headers to be enabled)
        <IfModule mod_headers.c>
                Header always set X-Content-Type-Options "nosniff"
                Header always set X-Frame-Options "SAMEORIGIN"
                Header always set X-XSS-Protection "1; mode=block"
                Header always set Referrer-Policy "strict-origin-when-cross-origin"
                Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        </IfModule>
</VirtualHost>
