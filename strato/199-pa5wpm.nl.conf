# Wildcard vhost voor subdomeinen van pa5wpm.nl
<VirtualHost *:80>
    ServerName wildcard.pa5wpm.nl
    ServerAlias *.pa5wpm.nl
    Redirect 404 /
</VirtualHost>

<VirtualHost *:443>
    ServerName wildcard.pa5wpm.nl
    ServerAlias *.pa5wpm.nl

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/cert_pa5wpm.crt
    SSLCertificateKeyFile /etc/ssl/private/pa5wpm.key

    Redirect 404 /
</VirtualHost>
