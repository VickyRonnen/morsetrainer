<VirtualHost *:80>
    ServerName pa5wpm.nl
    ServerAlias www.pa5wpm.nl
    ServerAdmin webmaster@pa5wpm.nl
    # Path-preserving HTTP to HTTPS redirect
    Redirect permanent / https://pa5wpm.denkzelf.nl/
</VirtualHost>

<VirtualHost *:443>
    ServerName pa5wpm.nl
    ServerAlias www.pa5wpm.nl
    ServerAdmin webmaster@pa5wpm.denkzelf.nl

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/cert_pa5wpm.crt
    SSLCertificateKeyFile /etc/ssl/private/pa5wpm.key

    Protocols h2 http/1.1

    DocumentRoot  "/var/www/pa5wpm.nl"
    <Directory "/var/www/pa5wpm.nl">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Angular routing fallback
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Security Headers (Requires mod_headers to be enabled)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>
</VirtualHost>
