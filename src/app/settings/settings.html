<main class="container full-height-minus-nav d-flex align-items-center justify-content-center">
  <form (submit)="submit()"
        [formGroup]="settingsForm"
        autocomplete="off"
        class="row gy-3 w-100"
        novalidate
        style="max-width: 720px;">
    <header class="col-12">
      <h1 class="h3 mb-1">Settings</h1>
      <h2 class="h6">
        Update your training preferences. Validation errors are announced when you leave a field.
      </h2>
    </header>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="wordSpeed">Word speed</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'wordSpeed-error'"
                 [attr.aria-invalid]="settingsForm.get('wordSpeed')?.invalid ? 'true' : null"
                 class="form-control"
                 formControlName="wordSpeed"
                 id="wordSpeed"
                 inputmode="numeric"
                 max="30"
                 min="1"
                 type="number">
          <control-error controlName="wordSpeed" id="wordSpeed-error"></control-error>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="groupSize">Group size</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'groupSize-error'"
                 [attr.aria-invalid]="settingsForm.get('groupSize')?.invalid ? 'true' : null"
                 class="form-control"
                 formControlName="groupSize"
                 id="groupSize"
                 inputmode="numeric"
                 max="10"
                 min="3"
                 type="number">
        </div>
      </div>
      <control-error controlName="groupSize" id="groupSize-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="pause">Pause before in seconds</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'pause-error'"
                 [attr.aria-invalid]="settingsForm.get('pause')?.invalid ? 'true' : null"
                 class="form-control"
                 formControlName="pause"
                 id="pause"
                 inputmode="numeric"
                 max="10"
                 min="0"
                 type="number">
        </div>
      </div>
      <control-error controlName="pause" id="pause-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="duration">Lesson duration in seconds</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'duration-error'"
                 [attr.aria-invalid]="settingsForm.get('duration')?.invalid ? 'true' : null"
                 class="form-control"
                 formControlName="duration"
                 id="duration"
                 inputmode="numeric"
                 max="600"
                 min="5"
                 type="number">
        </div>
      </div>
      <control-error controlName="duration" id="duration-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="tone">Tone</label>
        <div class="col-sm-8">
          <select class="form-select"
                  formControlName="tone"
                  id="tone">
            <option value="300">300</option>
            <option value="440">440</option>
            <option value="600">600</option>
            <option value="800">800</option>
            <option value="880">880</option>
            <option value="1000">1000</option>
          </select>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="toneVolume">Tone volume</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'toneVolume-error'"
                 [attr.aria-invalid]="settingsForm.get('toneVolume')?.invalid ? 'true' : null"
                 class="form-range"
                 formControlName="toneVolume"
                 id="toneVolume"
                 max="1"
                 min="0"
                 step="0.05"
                 type="range">
        </div>
      </div>
      <control-error controlName="toneVolume" id="toneVolume-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <div class="col-sm-4">
          <label class="form-check-label" for="revealBefore">Reveal before sending</label>
        </div>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'revealBefore-error'"
                 [attr.aria-invalid]="settingsForm.get('revealBefore')?.invalid ? 'true' : null"
                 class="form-check-input"
                 formControlName="revealBefore"
                 id="revealBefore"
                 type="checkbox">
        </div>
      </div>
      <control-error controlName="revealBefore" id="revealBefore-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="voice">Voice</label>
        <div class="col-sm-8">
          <select [attr.aria-describedby]="'voice-error'"
                  [attr.aria-invalid]="settingsForm.get('voice')?.invalid ? 'true' : null"
                  class="form-select"
                  formControlName="voice"
                  id="voice">
            @for (voice of voices; track voice) {
              <option value="{{voice.name}}">{{ voice.name }}</option>
            }
          </select>
        </div>
      </div>
      <control-error controlName="voice" id="voice-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="voiceVolume">Voice volume</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'voiceVolume-error'"
                 [attr.aria-invalid]="settingsForm.get('voiceVolume')?.invalid ? 'true' : null"
                 class="form-range"
                 formControlName="voiceVolume"
                 id="voiceVolume"
                 max="1"
                 min="0"
                 step="0.05"
                 type="range">
        </div>
      </div>
      <control-error controlName="voiceVolume" id="voiceVolume-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <label class="col-sm-4 col-form-label" for="voiceRate">Voice rate</label>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'voiceRate-error'"
                 [attr.aria-invalid]="settingsForm.get('voiceRate')?.invalid ? 'true' : null"
                 class="form-range"
                 formControlName="voiceRate"
                 id="voiceRate"
                 max="1.5"
                 min="0.5"
                 step="0.05"
                 type="range">
        </div>
      </div>
      <control-error controlName="voiceRate" id="voiceRate-error"></control-error>
    </div>

    <div class="col-12">
      <div class="row align-items-center g-2">
        <div class="col-sm-4">
          <label class="form-check-label" for="darkMode">Dark mode</label>
        </div>
        <div class="col-sm-8">
          <input [attr.aria-describedby]="'darkMode-error'"
                 [attr.aria-invalid]="settingsForm.get('darkMode')?.invalid ? 'true' : null"
                 class="form-check-input"
                 formControlName="darkMode"
                 id="darkMode"
                 type="checkbox">
        </div>
      </div>
      <control-error controlName="darkMode" id="darkMode-error"></control-error>
    </div>

    <div class="col-12 d-flex gap-2 mt-2 justify-content-start">
      <button [disabled]="settingsForm.invalid" class="btn btn-primary" type="submit">Save</button>
      <button (click)="onReset()" class="btn btn-secondary" type="button">Reset</button>
      <button (click)="onBack()" class="btn btn-success" type="button">Back</button>
    </div>
  </form>
</main>
